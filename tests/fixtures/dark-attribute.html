<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dark attribute fixture</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f3f4f6;
        --primary: #2563eb;
      }
      /* The dark theme applies when html has data-theme="dark"; the text color is a root-level rule. */
      [data-theme='dark'] {
        --bg: #18181b;
        --surface: #27272a;
        --primary: #f97316;
      }
      [data-theme='dark'] body {
        color: #d4d4d8;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #111827;
        font-family: Inter, system-ui, sans-serif;
        font-size: 16px;
        line-height: 24px;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .panel {
        background: var(--surface);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .btn {
        background: var(--primary);
        color: #ffffff;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Dark mode through a data attribute</h1>
      <p>Body copy in the text color over the background. The page is never switched to dark.</p>
      <div class="panel"><p>A panel on the surface color.</p></div>
      <div class="panel"><p>Another panel on the surface color.</p></div>
      <p><button class="btn">Primary action</button> <a class="btn" href="#a">Second action</a></p>
    </div>
  </body>
</html>
