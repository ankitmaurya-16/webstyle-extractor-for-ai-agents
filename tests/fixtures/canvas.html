<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas fixture</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="800" height="600"></canvas>
    <script>
      const ctx = document.getElementById('c').getContext('2d');
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(40, 40, 300, 200);
      ctx.fillStyle = '#ffffff';
      ctx.font = '32px sans-serif';
      ctx.fillText('Drawn on a canvas', 60, 150);
    </script>
  </body>
</html>
