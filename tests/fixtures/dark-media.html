<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dark media fixture</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f3f4f6;
        --text: #111827;
        --primary: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --surface: #111827;
          --text: #e5e7eb;
          --primary: #8b5cf6;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        font-size: 16px;
        line-height: 24px;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .panel {
        background: var(--surface);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .btn {
        background: var(--primary);
        color: #ffffff;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Dark mode through a media query</h1>
      <p>Body copy in the theme's text color over the theme's background.</p>
      <div class="panel"><p>A panel on the surface color.</p></div>
      <div class="panel"><p>Another panel on the surface color.</p></div>
      <p><button class="btn">Primary action</button> <a class="btn" href="#a">Second action</a></p>
    </div>
  </body>
</html>
