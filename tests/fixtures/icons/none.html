<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>No icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      /* Icon fonts are named only; no font file is loaded. */
      i {
        display: inline-block;
        width: 20px;
        height: 20px;
      }
      .note {
        padding: 8px;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <p>Icons below are simple shapes drawn for this fixture.</p>
    <p class="note">A page with text only.</p>
    <p class="note">Another paragraph.</p>
  </body>
</html>
