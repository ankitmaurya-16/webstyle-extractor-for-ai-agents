<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Font Awesome-like icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      /* Icon fonts are named only; no font file is loaded. */
      i {
        display: inline-block;
        width: 20px;
        height: 20px;
      }
      .fa-solid {
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <p>Icons below are simple shapes drawn for this fixture.</p>
    <i class="fa-solid fa-square"></i>
    <i class="fa-solid fa-circle"></i>
    <i class="fa-solid fa-xmark"></i>
    <svg
      class="svg-inline--fa fa-square"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <rect x="4" y="4" width="16" height="16" rx="2" />
    </svg>
  </body>
</html>
