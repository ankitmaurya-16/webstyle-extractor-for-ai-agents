<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lucide-like icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      /* Icon fonts are named only; no font file is loaded. */
      i {
        display: inline-block;
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <p>Icons below are simple shapes drawn for this fixture.</p>
    <svg
      class="lucide lucide-square"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <rect x="4" y="4" width="16" height="16" rx="2" />
    </svg>
    <svg
      class="lucide lucide-circle"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="8" />
    </svg>
    <svg
      class="lucide lucide-x"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
    <svg
      class="lucide lucide-square"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <rect x="4" y="4" width="16" height="16" rx="2" />
    </svg>
  </body>
</html>
