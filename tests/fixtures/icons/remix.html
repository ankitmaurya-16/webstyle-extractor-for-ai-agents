<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Remix Icon-like icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      /* Icon fonts are named only; no font file is loaded. */
      i {
        display: inline-block;
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <p>Icons below are simple shapes drawn for this fixture.</p>
    <i class="ri-square-line"></i>
    <i class="ri-circle-line"></i>
    <i class="ri-close-line"></i>
  </body>
</html>
