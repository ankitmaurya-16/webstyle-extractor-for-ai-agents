<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Material Symbols-like icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      /* Icon fonts are named only; no font file is loaded. */
      i {
        display: inline-block;
        width: 20px;
        height: 20px;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-size: 24px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <p>Icons below are simple shapes drawn for this fixture.</p>
    <span class="material-symbols-outlined">home</span>
    <span class="material-symbols-outlined">search</span>
    <span class="material-symbols-outlined">close</span>
  </body>
</html>
