<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gradients fixture</title>
    <style>
      :root {
        --gradient-hero: linear-gradient(to right, rgb(37, 99, 235), rgb(124, 58, 237));
      }
      body {
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
        margin: 0;
        padding: 16px;
      }
      section {
        margin-bottom: 16px;
      }
      .hero {
        height: 300px;
        background-image: var(--gradient-hero);
      }
      .radial {
        height: 200px;
        background-image: radial-gradient(circle at center, #f59e0b 0%, #ef4444 100%);
      }
      .conic {
        width: 160px;
        height: 160px;
        background-image: conic-gradient(from 90deg, #10b981, #3b82f6, #10b981);
      }
      .stripes {
        height: 120px;
        background-image: repeating-linear-gradient(45deg, #e5e7eb 0 10px, #ffffff 10px 20px);
      }
      .rings {
        height: 100px;
        background-image: repeating-radial-gradient(circle, #fde68a 0 8px, #fef3c7 8px 16px);
      }
      /* Two gradient layers in one background-image. */
      .layered {
        height: 80px;
        background-image:
          linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0)),
          radial-gradient(ellipse at top, #22d3ee, #0e7490);
      }
      .sweep {
        height: 40px;
        background-image: repeating-conic-gradient(#111827 0deg 15deg, #f9fafb 15deg 30deg);
      }
      .gradient-text {
        font-size: 32px;
        font-weight: 700;
        background-image: linear-gradient(90deg, #ec4899, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* One stop only is not a usable gradient. */
      .single {
        height: 20px;
        background-image: linear-gradient(#000000, #000000);
      }
      .brand {
        background: #2563eb;
        color: #ffffff;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <section class="hero"></section>
    <section class="radial"></section>
    <section class="conic"></section>
    <section class="stripes"></section>
    <section class="rings"></section>
    <section class="layered"></section>
    <section class="sweep"></section>
    <section class="single"></section>
    <h1 class="gradient-text">Gradient text heading</h1>
    <p>
      Body text on white. The gradients above are decoration; this paragraph carries the page's text
      color so that roles come from ordinary usage rather than from gradient stops.
    </p>
    <p>
      <button class="brand">Primary action</button> <button class="brand">Second action</button>
    </p>
  </body>
</html>
