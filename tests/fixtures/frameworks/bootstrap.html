<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bootstrap-like fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      :root {
        --bs-blue: #0d6efd;
        --bs-body-color: #212529;
        --bs-body-bg: #ffffff;
        --bs-border-radius: 0.375rem;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
      }
      .row {
        display: flex;
        gap: 16px;
      }
      .col-md-6 {
        flex: 1;
      }
      .d-flex {
        display: flex;
      }
      .btn {
        padding: 6px 12px;
        border-radius: var(--bs-border-radius);
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--bs-blue);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-6"><p>Column one copy.</p></div>
        <div class="col-md-6"><p>Column two copy.</p></div>
      </div>
      <div class="d-flex">
        <button class="btn btn-primary">Action</button>
      </div>
    </div>
  </body>
</html>
