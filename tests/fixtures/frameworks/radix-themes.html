<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Radix Themes-like fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      .radix-themes {
        --accent-1: hsl(226 70% 92%);
        --accent-2: hsl(226 70% 86%);
        --accent-3: hsl(226 70% 80%);
        --accent-4: hsl(226 70% 74%);
        --accent-5: hsl(226 70% 68%);
        --accent-6: hsl(226 70% 62%);
        --accent-7: hsl(226 70% 56%);
        --accent-8: hsl(226 70% 50%);
        --accent-9: hsl(226 70% 44%);
        --accent-10: hsl(226 70% 38%);
        --accent-11: hsl(226 70% 32%);
        --accent-12: hsl(226 70% 26%);
      }
      :root {
        --accent-1: hsl(226 70% 92%);
        --accent-2: hsl(226 70% 86%);
        --accent-3: hsl(226 70% 80%);
        --accent-4: hsl(226 70% 74%);
        --accent-5: hsl(226 70% 68%);
        --accent-6: hsl(226 70% 62%);
        --accent-7: hsl(226 70% 56%);
        --accent-8: hsl(226 70% 50%);
        --accent-9: hsl(226 70% 44%);
        --accent-10: hsl(226 70% 38%);
        --accent-11: hsl(226 70% 32%);
        --accent-12: hsl(226 70% 26%);
      }
      .rt-Button {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--accent-9);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="radix-themes">
      <p class="rt-Text">Theme copy.</p>
      <button class="rt-Button">Action</button>
    </div>
  </body>
</html>
