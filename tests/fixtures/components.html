<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Components fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      .b {
        background: #2563eb;
        color: #ffffff;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
      }
      .cta {
        background: #2563eb;
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
      }
      input,
      textarea,
      select {
        border: 1px solid #d1d5db;
        padding: 8px;
        border-radius: 4px;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <p>
      <button class="b">One</button>
      <input type="submit" class="b" value="Two" />
      <input type="button" class="b" value="Three" />
      <span role="button" class="b">Four</span>
      <input type="checkbox" aria-label="Not a button" />
      <input type="reset" class="b" value="Not counted" />
    </p>
    <p>
      Read the <a href="#a">inline link</a> in running text, then the
      <a href="#b">second link</a> here.
    </p>
    <p><a href="#c" class="cta">Styled as a button</a></p>
    <p>
      <input type="text" aria-label="Text" /> <input type="email" aria-label="Email" />
      <input type="search" aria-label="Search" />
      <textarea aria-label="Message"></textarea>
      <select aria-label="Pick">
        <option>One</option>
      </select>
      <input type="range" aria-label="Not text" />
    </p>
    <ul>
      <li>Filler one</li>
      <li>Filler two</li>
      <li>Filler three</li>
      <li>Filler four</li>
      <li>Filler five</li>
      <li>Filler six</li>
      <li>Filler seven</li>
      <li>Filler eight</li>
      <li>Filler nine</li>
      <li>Filler ten</li>
    </ul>
  </body>
</html>
